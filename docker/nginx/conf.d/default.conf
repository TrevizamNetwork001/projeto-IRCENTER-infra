server {
    listen 80;
    listen [::]:80;

    server_name ircenter.trevizamnetwork.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ircenter.trevizamnetwork.com.br;

    ssl_certificate     /etc/letsencrypt/live/ircenter.trevizamnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ircenter.trevizamnetwork.com.br/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    fastcgi_hide_header X-Powered-By;

    # Aplicação independente de Documentação Técnica
    location = /documentacao {
        return 301 /documentacao/;
    }

    location ^~ /documentacao/assets/ {
        alias /var/www/documentation/public/assets/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /documentacao/ {
        # Resolver Docker para acompanhar mudanças de IP do container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $documentation_upstream documentation-app:9000;

        # Remove o prefixo público antes de entregar a requisição ao Laravel.
        rewrite ^/documentacao/?(.*)$ /$1 break;

        include fastcgi_params;

        fastcgi_pass $documentation_upstream;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/documentation/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/documentation/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_SELF /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PREFIX /documentacao;

        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
