services:
  web:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: ircenter-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      documentation-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html:ro
      - ./documentation-app:/var/www/documentation:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/health/nginx-healthcheck.sh:/usr/local/bin/ircenter-nginx-healthcheck:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-nginx-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./app/.env
    volumes:
      - app_storage:/var/www/html/storage
    tmpfs:
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./app/.env
    command: /usr/local/bin/ircenter-queue-run
    volumes:
      - app_storage:/var/www/html/storage
    tmpfs:
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-heartbeat-healthcheck", "queue", "150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./app/.env
    command: /usr/local/bin/ircenter-scheduler-run
    volumes:
      - ./app:/var/www/html:ro
      - app_storage:/var/www/html/storage
    tmpfs:
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-heartbeat-healthcheck", "scheduler", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  documentation-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-documentation-app
    restart: unless-stopped
    working_dir: /var/www/documentation
    env_file:
      - ./documentation-app/.env
    volumes:
      - documentation_storage:/var/www/documentation/storage
    tmpfs:
      - /var/www/documentation/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  documentation-queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-documentation-queue
    restart: unless-stopped
    working_dir: /var/www/documentation
    env_file:
      - ./documentation-app/.env
    command: /usr/local/bin/ircenter-queue-run
    volumes:
      - documentation_storage:/var/www/documentation/storage
    tmpfs:
      - /var/www/documentation/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-heartbeat-healthcheck", "queue", "150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  documentation-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ircenter-documentation-scheduler
    restart: unless-stopped
    working_dir: /var/www/documentation
    env_file:
      - ./documentation-app/.env
    command: /usr/local/bin/ircenter-scheduler-run
    volumes:
      - documentation_storage:/var/www/documentation/storage
    tmpfs:
      - /var/www/documentation/bootstrap/cache:uid=33,gid=33,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircenter-heartbeat-healthcheck", "scheduler", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: ircenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: ircenter-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    container_name: ircenter-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  postgres_data:
  redis_data:
  app_storage:
    name: ircenter_app_storage
  documentation_storage:
    name: ircenter_documentation_storage
  certbot_www:
    name: ircenter_certbot_www
  certbot_conf:
    name: ircenter_certbot_conf

networks:
  frontend:
  backend:
